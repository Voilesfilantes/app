<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#07141f"/>
<meta name="robots" content="noindex"/>
<title>⛵ Prochaines sorties</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07141f;color:#e8f4f8;font-family:'DM Sans',system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:560px;margin:0 auto}
.bar a,.bar button{color:#d4af37;text-decoration:none;font-size:24px;background:none;border:0;cursor:pointer}
.bar button{font-size:13px;border:1px solid rgba(212,175,55,.4);border-radius:8px;padding:5px 10px;margin-left:auto}
#msg{max-width:560px;margin:40px auto;padding:0 20px;text-align:center;color:rgba(255,255,255,.6);font-size:14px;line-height:1.6}
iframe{border:0;width:100%;display:block;height:calc(100% - 52px)}
</style>
</head>
<body>
<div class="bar"><a href="plateformes.html" aria-label="Retour">‹</a><button id="reload">↻ Actualiser</button></div>
<div id="msg">Chargement…</div>
<iframe id="f" title="Prochaines sorties" hidden></iframe>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwDZF4mVrOUOCwZy0IaYeYlbgjeLiNS_NBGUK9GMuFjA-AhFswEb_RL2SaBGH4Ih7zSvA/exec';
let key = '';
try { key = localStorage.getItem('vf_key') || ''; } catch (e) {}
const msg = document.getElementById('msg'), f = document.getElementById('f');

async function load() {
  if (!key) { msg.textContent = 'Clé absente : ouvre une fois le lien privé reçu (…plateformes.html#k=…) sur cet appareil.'; return; }
  msg.hidden = false; msg.textContent = 'Chargement…';
  try {
    const r = await fetch(API + '?json=1&k=' + encodeURIComponent(key), { credentials: 'omit' });
    const d = await r.json();
    f.srcdoc = d.html; f.hidden = false; msg.hidden = true;
  } catch (e) {
    msg.textContent = 'Impossible de charger les sorties (clé invalide ou pas de réseau).';
  }
}
document.getElementById('reload').onclick = load;
load();
</script>
</body>
</html>
